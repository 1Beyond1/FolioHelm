[package]
name = "foliohelm"
version = "0.1.0"
description = "FolioHelm desktop application core"
authors = ["FolioHelm contributors"]
edition = "2021"
rust-version = "1.92.0"
build = "build.rs"

[lib]
name = "foliohelm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = ["codegen"] }

[dependencies]
aes-gcm = { version = "=0.10.3", features = ["zeroize"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
ed25519-dalek = { version = "=3.0.0" }
getrandom = { version = "=0.3.4" }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "charset", "http2"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151" }
sha2 = { version = "=0.10.9" }
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.0"
thiserror = { version = "=2.0.20" }
zeroize = { version = "=1.9.2", features = ["derive"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }

[target.'cfg(not(any(target_os = "windows", target_os = "macos")))'.dependencies]
keyring = { version = "=3.6.3", features = ["linux-native"] }
