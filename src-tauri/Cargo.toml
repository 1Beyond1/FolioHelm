[package]
name = "foliohelm"
version = "0.1.0"
description = "FolioHelm desktop application core"
authors = ["FolioHelm contributors"]
edition = "2021"
rust-version = "1.92.0"
build = "build.rs"

[lib]
name = "foliohelm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = ["codegen"] }

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
ed25519-dalek = { version = "=3.0.0" }
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = { version = "=0.10.9" }
tauri = { version = "=2.11.5", features = [] }
thiserror = { version = "=2.0.20" }

[dev-dependencies]
serde_json = { version = "=1.0.151" }
